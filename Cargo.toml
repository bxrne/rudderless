[workspace]
resolver = "2"
members = ["librdl", "rdld", "rdlctl"]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Adam Byrne <adamrbyrne@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
librdl = { path = "librdl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
